    }

    function submitBulkLog() {
      const rows = document.querySelectorAll('.bulk-row');
      const errEl = document.getElementById('bulkError');
      const successEl = document.getElementById('bulkSuccess');
      errEl.textContent = '';
      successEl.textContent = '';
      if (!rows.length) { errEl.textContent = 'Add at least one row.'; return; }

      const entries = [];
      let valid = true;
      rows.forEach(function (row) {
        const idx = row.id.split('-')[1];
        const memberId = document.getElementById('bulkMember-' + idx).value;
        const amount = parseAmountValue('bulkAmount-' + idx);
        const date = document.getElementById('bulkDate-' + idx).value;
        const ref = document.getElementById('bulkRef-' + idx).value;
        if (!memberId || !amount || !date) valid = false;
        entries.push({ memberId: memberId, amount: amount, paymentDate: date, reference: ref });
      });
      if (!valid) { errEl.textContent = 'Every row needs a member, amount, and date.'; return; }

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            renderAdminContributions();
          } else {
            errEl.textContent = res.message || 'Could not save entries.';
          }
        })
        .withFailureHandler(function () {
          errEl.textContent = 'Something went wrong. Please try again.';
        })
        .bulkLogContributions(TOKEN, entries);
    }

    // ---------- Withdraw Contribution (its own screen) ----------
    function renderWithdrawForm() {
      swapApp(
        '<div class="app-shell"><div class="topbar">' +
        '<button class="link-btn" onclick="renderAdminContributions()">&larr; Back to Contributions</button>' +
        '</div><h2>Withdraw Contribution</h2>' +
        '<div id="withdrawPane">' + spinnerHTML() + '</div></div>',
        function () { loadWithdrawForm(); }
      );
    }

    let WITHDRAW_MEMBERS = [];

    function loadWithdrawForm() {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.success) { document.getElementById('withdrawPane').innerHTML = '<div class="err">' + res.message + '</div>'; return; }
          WITHDRAW_MEMBERS = res.members;
          const memberOptions = res.members.map(function (m) {
            return '<option value="' + m.memberId + '">' + m.fullName + '</option>';
          }).join('');
          document.getElementById('withdrawPane').innerHTML =
            '<div class="section">' +
            '<p class="hint">Withdrawals are full-balance only — there\'s no partial withdrawal option.</p>' +
            '<label>Member</label>' +
            '<select id="withdrawMember" onchange="updateWithdrawBalanceDisplay()">' + memberOptions + '</select>' +
            '<div class="calc-box" style="margin:10px 0"><div class="row total"><span>Current balance</span><span id="withdrawBalanceDisplay"></span></div></div>' +
            '<label>Date</label>' +
            '<input type="date" id="withdrawDate">' +
            '<label>Note (optional)</label>' +
            '<input type="text" id="withdrawNote" placeholder="e.g. reason for withdrawal">' +
            '<button onclick="submitWithdrawal()" id="withdrawBtn">Withdraw Full Balance</button>' +
            '<div id="withdrawError" class="err"></div>' +
            '<div id="withdrawSuccess" style="color:#34C759;font-size:13px;margin-top:8px"></div>' +
            '</div>';
          updateWithdrawBalanceDisplay();
        })
        .withFailureHandler(function () {
          document.getElementById('withdrawPane').innerHTML = '<div class="err">Could not load members.</div>';
        })
        .getActiveMembers(TOKEN);
    }

    function updateWithdrawBalanceDisplay() {
      const memberId = document.getElementById('withdrawMember').value;
      const member = WITHDRAW_MEMBERS.find(function (m) { return String(m.memberId) === String(memberId); });
      const balance = member ? member.contributionBalance : 0;
      document.getElementById('withdrawBalanceDisplay').textContent = fmtMoney(balance);
      const btn = document.getElementById('withdrawBtn');
      if (btn) btn.disabled = !balance || balance <= 0;
    }

    function submitWithdrawal() {
      const memberId = document.getElementById('withdrawMember').value;
      const date = document.getElementById('withdrawDate').value;
      const note = document.getElementById('withdrawNote').value;
      const btn = document.getElementById('withdrawBtn');
      const errEl = document.getElementById('withdrawError');
      const successEl = document.getElementById('withdrawSuccess');
      errEl.textContent = '';
      successEl.textContent = '';

      if (!memberId || !date) {
        errEl.textContent = 'Select a member and date.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Processing...';

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            renderAdminContributions();
          } else {
            btn.disabled = false;
            btn.textContent = 'Withdraw Full Balance';
            errEl.textContent = res.message || 'Could not process withdrawal.';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Withdraw Full Balance';
          errEl.textContent = 'Something went wrong. Please try again.';
        })
        .withdrawContribution(TOKEN, memberId, date, note);
    }

    // ---------- Statement of Contribution generator ----------
    function renderStatementGenerator() {
      swapApp(
        '<div class="app-shell"><div class="topbar">' +
        '<button class="link-btn" onclick="renderAdminContributions()">&larr; Back to Contributions</button>' +
        '</div><h2>Generate Statement</h2>' +
        '<div id="statementPane">' + spinnerHTML() + '</div></div>',
        function () { loadStatementForm(); }
      );
    }

    function loadStatementForm() {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res.success) { document.getElementById('statementPane').innerHTML = '<div class="err">' + res.message + '</div>'; return; }
          const memberOptions = res.members.map(function (m) {
            return '<option value="' + m.memberId + '">' + m.fullName + '</option>';
          }).join('');
          document.getElementById('statementPane').innerHTML =
            '<div class="section">' +
            '<label>Member</label>' +
            '<select id="stmtMember">' + memberOptions + '</select>' +
            '<label>From (optional)</label>' +
            '<input type="date" id="stmtFrom">' +
            '<label>To (optional)</label>' +
            '<input type="date" id="stmtTo">' +
            '<div class="hint">Leave both dates blank for the member\'s full history.</div>' +
            '<button onclick="generateStatement()" id="stmtGenerateBtn">Generate Statement</button>' +
            '<div id="stmtError" class="err"></div>' +
            '</div>';
        })
        .withFailureHandler(function () {
          document.getElementById('statementPane').innerHTML = '<div class="err">Could not load members.</div>';
        })
        .getActiveMembers(TOKEN);
    }

    function generateStatement() {
      const memberId = document.getElementById('stmtMember').value;
      const from = document.getElementById('stmtFrom').value;
      const to = document.getElementById('stmtTo').value;
      const btn = document.getElementById('stmtGenerateBtn');
      const errEl = document.getElementById('stmtError');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Generating...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = 'Generate Statement';
          if (!res.success) { errEl.textContent = res.message || 'Could not generate statement.'; return; }
          renderStatementView(res, from, to);
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Generate Statement';
          errEl.textContent = 'Something went wrong. Please try again.';
        })
        .getMemberStatementData(TOKEN, memberId, from, to);
    }

    function renderStatementView(data, from, to) {
      const periodLabel = (from || to)
        ? (from ? fmtDate(from) : 'the beginning') + ' to ' + (to ? fmtDate(to) : 'today')
        : 'All Time';

      let rowsHtml = '<tr><td colspan="4" style="padding:12px 4px;text-align:center;color:var(--text-tertiary);">No transactions in this period.</td></tr>';
      if (data.transactions.length) {
        rowsHtml = data.transactions.map(function (t) {
          return '<tr>' +
            '<td style="padding:8px 4px;border-bottom:1px solid var(--hairline);">' + fmtDate(t.paymentDate) + '</td>' +
            '<td style="padding:8px 4px;border-bottom:1px solid var(--hairline);">' + t.transId +
            (t.reference ? '<br><span class="hint" style="margin:0">' + t.reference + '</span>' : '') + '</td>' +
            '<td style="padding:8px 4px;border-bottom:1px solid var(--hairline);text-align:right;">' + fmtMoney(t.amount) + '</td>' +
            '<td style="padding:8px 4px;border-bottom:1px solid var(--hairline);text-align:right;">' + fmtMoney(t.runningBalance) + '</td>' +
            '</tr>';
        }).join('');
      }

      const openingRow = (from && data.openingBalance !== 0)
        ? '<tr><td colspan="3" style="padding:8px 4px;border-bottom:1px solid var(--hairline);font-style:italic;color:var(--text-secondary);">Opening Balance</td>' +
          '<td style="padding:8px 4px;border-bottom:1px solid var(--hairline);text-align:right;font-style:italic;color:var(--text-secondary);">' + fmtMoney(data.openingBalance) + '</td></tr>'
        : '';

      swapApp(
        '<div class="app-shell">' +
        '<div class="topbar no-print">' +
        '<button class="link-btn" onclick="renderStatementGenerator()">&larr; New Statement</button>' +
        '<button onclick="window.print()" style="width:auto;padding:8px 16px;">Save as PDF</button>' +
        '</div>' +
        '<div class="section">' +
        '<div style="text-align:center;margin-bottom:20px;">' +
        '<div style="font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.06em;">Finance Sinking Fund</div>' +
        '<h1 style="margin:4px 0;font-size:22px;">Statement of Contribution</h1>' +
        '</div>' +
        '<div style="font-size:14px;margin-bottom:16px;">' +
        '<div><strong>' + data.memberName + '</strong> &middot; Member ID ' + data.memberId + '</div>' +
        '<div class="hint" style="margin:4px 0 0">Period: ' + periodLabel + '</div>' +
        '</div>' +
        '<table style="width:100%;border-collapse:collapse;font-size:13px;">' +
        '<thead><tr style="text-align:left;border-bottom:2px solid var(--hairline);">' +
        '<th style="padding:8px 4px;">Date</th><th style="padding:8px 4px;">Reference</th>' +
        '<th style="padding:8px 4px;text-align:right;">Amount</th><th style="padding:8px 4px;text-align:right;">Balance</th>' +
        '</tr></thead><tbody>' + openingRow + rowsHtml + '</tbody>' +
        '<tfoot><tr style="border-top:2px solid var(--hairline);font-weight:700;">' +
        '<td colspan="3" style="padding:10px 4px;">Closing Balance</td>' +
        '<td style="padding:10px 4px;text-align:right;">' + fmtMoney(data.closingBalance) + '</td>' +
        '</tr></tfoot></table>' +
        '<p class="hint" style="margin-top:20px;margin-bottom:0;">Generated on ' + fmtDate(new Date()) + '.</p>' +
        '</div></div>'
      );
    }

    // ---------- ADMIN: SETTINGS ----------
    var SETTINGS_FIELDS = [
      { group: 'Loan Rules', key: 'InterestRate_Default', label: 'Default Interest Rate (% / month)', type: 'number', step: '0.1' },
      { group: 'Loan Rules', key: 'InterestRate_Min', label: 'Minimum Interest Rate (% / month)', type: 'number', step: '0.1' },
      { group: 'Loan Rules', key: 'InterestRate_Max', label: 'Maximum Interest Rate (% / month)', type: 'number', step: '0.1' },
      { group: 'Loan Rules', key: 'MaxLoanMultipleOfContributions', label: 'Max Loan = this x Total Contributions', type: 'number', step: '1' },
      { group: 'Dividend Rules', key: 'DividendMethod', label: 'Dividend Calculation Method', type: 'select', options: ['AVERAGE_MONTHLY_BALANCE'] },
      { group: 'Dividend Rules', key: 'DividendPoolPercent', label: 'Dividend Pool (% of Net Earnings)', type: 'number', step: '1' },
      { group: 'Dividend Rules', key: 'MinTenureMonthsForDividend', label: 'Min. Membership Months for Dividend Eligibility', type: 'number', step: '1' },
      { group: 'Session', key: 'SessionLengthHours', label: 'Login Session Length (hours)', type: 'number', step: '1' }
    ];

    function renderAdminSettings() {
      swapApp(
        '<div class="app-shell"><div class="topbar">' +
        '<button class="link-btn" onclick="renderAdminHome()">&larr; Back to Admin Home</button>' +
        '</div><h2>Settings</h2>' +
        appearanceSectionHtml_() +
        '<div id="settingsContent">' + spinnerHTML() + '</div></div>',
        function () {
          google.script.run
            .withSuccessHandler(function (res) {
              if (!res.success) { document.getElementById('settingsContent').innerHTML = '<div class="err">' + res.message + '</div>'; return; }
              renderSettingsForm(res.settings);
            })
            .withFailureHandler(function () {
              document.getElementById('settingsContent').innerHTML = '<div class="err">Could not load settings.</div>';
            })
            .getSettingsForAdmin(TOKEN);
        }
      );
    }

    function renderSettingsForm(settings) {
      const groups = {};
      SETTINGS_FIELDS.forEach(function (f) {
        if (!groups[f.group]) groups[f.group] = [];
        groups[f.group].push(f);
      });

      let html = '<form id="settingsForm">';
      Object.keys(groups).forEach(function (groupName) {
        html += '<div class="section"><h2>' + groupName + '</h2>';
        groups[groupName].forEach(function (f) {
          const current = settings[f.key] ? settings[f.key].value : '';
          const desc = settings[f.key] ? settings[f.key].description : '';
          html += '<label>' + f.label + '</label>';
          if (f.type === 'select') {
            html += '<select id="setting-' + f.key + '">' +
              f.options.map(function (o) {
                return '<option value="' + o + '"' + (o === current ? ' selected' : '') + '>' + o + '</option>';
              }).join('') + '</select>';
          } else {
            html += '<input type="number" id="setting-' + f.key + '" step="' + f.step + '" value="' + current + '">';
          }
          if (desc) html += '<div class="hint">' + desc + '</div>';
        });
        html += '</div>';
      });
      html += '<button type="submit" id="settingsSaveBtn">Save Settings</button>' +
        '<div id="settingsSaved" class="err"></div></form>';

      document.getElementById('settingsContent').innerHTML = html;
      document.getElementById('settingsForm').addEventListener('submit', saveSettings);
    }

    function saveSettings(e) {
      e.preventDefault();
      const updates = {};
      SETTINGS_FIELDS.forEach(function (f) {
        const el = document.getElementById('setting-' + f.key);
        updates[f.key] = f.type === 'select' ? el.value : Number(el.value);
      });

      const btn = document.getElementById('settingsSaveBtn');
      const msgEl = document.getElementById('settingsSaved');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      msgEl.textContent = '';
      msgEl.style.color = '#A63446';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = 'Save Settings';
          if (res.success) {
            msgEl.style.color = '#3F6B4F';
            msgEl.textContent = 'Saved.';
          } else {
            msgEl.textContent = res.message || 'Could not save settings.';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Save Settings';
          msgEl.textContent = 'Something went wrong. Please try again.';
        })
        .updateSettings(TOKEN, updates);
    }

    // ---------- ADMIN: DIVIDEND CALCULATOR ----------
    let LAST_DIVIDEND_CALC = null;

    function renderDividendCalculator() {
      const defaultYear = new Date().getFullYear() - 1;
      swapApp(
        '<div class="app-shell"><div class="topbar">' +
        '<button class="link-btn" onclick="renderAdminHome()">&larr; Back to Admin Home</button>' +
        '</div><h2>Year-End Dividend Calculator</h2>' +
        '<div class="section">' +
        '<label>Year</label>' +
        '<input type="number" id="divYear" value="' + defaultYear + '" step="1">' +
        '<div class="hint">The earnings pool (GoTyme bank interest + loan interest collected) is calculated automatically for this year\'s period — no manual entry needed.</div>' +
        '<button onclick="previewDividends()" id="previewBtn">Preview Calculation</button>' +
        '<div id="divError" class="err"></div>' +
        '</div>' +
        '<div id="divResults"></div></div>'
      );
    }

    function previewDividends() {
      const year = document.getElementById('divYear').value;
      const errEl = document.getElementById('divError');
      const btn = document.getElementById('previewBtn');
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Calculating...';

      google.script.run
        .withSuccessHandler(function (res) {
          btn.disabled = false;
          btn.textContent = 'Preview Calculation';
          if (!res.success) { errEl.textContent = res.message || 'Could not calculate.'; return; }
          LAST_DIVIDEND_CALC = { year: year };
          renderDividendResults(res, year);
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Preview Calculation';
          errEl.textContent = 'Something went wrong. Please try again.';
        })
        .previewDividendCalculation(TOKEN, year);
    }

    function renderDividendResults(res, year) {
      let rowsHtml = '<div class="empty">No eligible members.</div>';
      if (res.results.length) {
        rowsHtml = '<div class="loan-row" style="font-weight:700;color:#888;font-size:11px">' +
          '<span>MEMBER</span><span>SHARE / DIVIDEND</span></div>' +
          res.results.map(function (r) {
            return '<div class="loan-row"><span>' + r.memberName +
              '<div class="hint" style="margin:0">time-weighted avg ' + fmtMoney(r.avgBalance) + ' &middot; ' + r.sharePercent.toFixed(2) + '%</div></span>' +
              '<span style="font-weight:700">' + fmtMoney(r.dividendAmount) + '</span></div>';
          }).join('');
      }

      let excludedHtml = '';
      if (res.excluded.length) {
        excludedHtml = '<div class="section"><h2>Not Eligible</h2>' +
          res.excluded.map(function (x) {
            return '<div class="loan-row"><span>' + x.memberName + '</span><span class="hint" style="margin:0">' + x.reason + '</span></div>';
          }).join('') + '</div>';
      }

      document.getElementById('divResults').innerHTML =
        '<div class="calc-box" style="margin-bottom:16px">' +
        '<div class="hint" style="margin:0 0 8px">Period: ' + fmtDate(res.periodStart) + ' &ndash; ' + fmtDate(res.periodEnd) + ' (' + res.bankInterest.days + ' days)</div>' +
        '<div class="row"><span>GoTyme Interest (gross)</span><span>' + fmtMoney(res.bankInterest.grossInterest) + '</span></div>' +
        '<div class="row"><span>Withholding Tax</span><span>&minus;' + fmtMoney(res.bankInterest.withholdingTax) + '</span></div>' +
        '<div class="row"><span>GoTyme Interest (net)</span><span>' + fmtMoney(res.bankInterest.netInterest) + '</span></div>' +
        '<div class="row"><span>Loan Interest Collected</span><span>' + fmtMoney(res.loanInterest) + '</span></div>' +
        '<div class="row"><span>Combined Earnings</span><span>' + fmtMoney(res.combinedEarnings) + '</span></div>' +
        '<div class="row total"><span>Dividend Pool</span><span>' + fmtMoney(res.poolAmount) + '</span></div>' +
        '</div>' +
        '<div class="calc-box" style="margin-bottom:16px">' +
        '<div class="row"><span>Total Time-Weighted Balance (all eligible members)</span><span>' + fmtMoney(res.totalShareSum) + '</span></div>' +
        '<div class="row total"><span>Eligible Members</span><span>' + res.results.length + '</span></div>' +
        '</div>' +
        '<div class="section">' + rowsHtml + '</div>' +
        excludedHtml +
        '<button id="commitBtn" onclick="checkAndCommitDividends()">Save to Dividends Sheet</button>' +
        '<div id="commitError" class="err"></div>';
    }

    function checkAndCommitDividends() {
      const year = LAST_DIVIDEND_CALC.year;
      google.script.run
        .withSuccessHandler(function (statusRes) {
          if (!statusRes.success) { document.getElementById('commitError').textContent = statusRes.message; return; }
          let msg = 'Save these dividend amounts to the Dividends sheet for ' + year + '?';
          if (statusRes.exists) {
            msg = 'There are already ' + statusRes.count + ' dividend record(s) for ' + year +
              '. Saving will REPLACE them with this calculation. Continue?';
          }
          showConfirmModal({
            title: 'Save Dividends',
            message: msg,
            confirmLabel: 'Save',
            danger: statusRes.exists,
            onConfirm: commitDividends
          });
        })
        .withFailureHandler(function () {
          document.getElementById('commitError').textContent = 'Could not check existing records.';
        })
        .getDividendYearStatus(TOKEN, year);
    }

    function commitDividends() {
      const btn = document.getElementById('commitBtn');
      const errEl = document.getElementById('commitError');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      errEl.textContent = '';

      google.script.run
        .withSuccessHandler(function (res) {
          if (res.success) {
            btn.textContent = 'Saved';
            errEl.style.color = '#3F6B4F';
            errEl.textContent = 'Saved dividends for ' + res.count + ' member(s).';
          } else {
            btn.disabled = false;
            btn.textContent = 'Save to Dividends Sheet';
            errEl.textContent = res.message || 'Could not save.';
          }
        })
        .withFailureHandler(function () {
          btn.disabled = false;
          btn.textContent = 'Save to Dividends Sheet';
          errEl.textContent = 'Something went wrong. Please try again.';
        })
        .commitDividendCalculation(TOKEN, LAST_DIVIDEND_CALC.year);
    }
  </script>
</body>
</html>
